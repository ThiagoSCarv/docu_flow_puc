services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: organizadoc
      POSTGRES_PASSWORD: organizadoc
      POSTGRES_DB: organizadoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organizadoc"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
